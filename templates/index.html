<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182820;background:#f7f8f5;font-synthesis:none;font-size:20px}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button,a,input,textarea,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{opacity:.6;cursor:wait}button:focus-visible,a:focus-visible{outline:3px solid #987020;outline-offset:4px}a{color:#245c48}h1{font-size:34px;line-height:1.25;margin:0 0 32px}p{line-height:1.5}main{min-height:100vh;min-height:100dvh;padding:max(28px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));display:flex;flex-direction:column;width:100%;margin:auto}.screen{flex:1;display:flex;flex-direction:column;width:100%;min-width:0}.login{padding-top:clamp(24px,10vh,100px)}.login form{margin-top:24px}label{display:block;font-size:22px;font-weight:600;margin:0 0 12px}input,textarea,select{width:100%;min-width:0;color:#182820;background:white;border:1px solid #a1b2a7;border-radius:14px;padding:16px;font-size:24px;min-height:64px}input:focus,textarea:focus,select:focus{outline:3px solid #c7dbd0;border-color:#245c48}button.primary{display:block;width:100%;min-height:76px;border:0;border-radius:16px;background:#245c48;color:#fff;padding:20px 12px;font-size:24px;font-weight:700;margin-top:24px}button.secondary{background:#e7ede6;color:#245c48;border:0;border-radius:12px;padding:14px 18px;min-height:48px;font-size:18px}.message{color:#8a3029;line-height:1.5;font-size:20px;overflow-wrap:anywhere;margin:20px 0 0}.message:empty{margin:0}.hint{color:#526158}.remaining{font-size:22px;color:#526158;text-align:center;margin:12px 0 0}.coupon-details{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 0;gap:32px}.caption{font-size:22px;color:#526158;margin-bottom:10px}.secret{font-size:clamp(36px,10vw,48px);font-weight:750;line-height:1.4;font-variant-numeric:tabular-nums;letter-spacing:.025em;overflow-wrap:anywhere;white-space:pre-wrap}.hold{position:relative;isolation:isolate;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.hold:before{content:"";position:absolute;inset:0;transform:scaleX(var(--progress,0));transform-origin:left;background:#153b2f;z-index:-1}.empty{justify-content:center;padding-bottom:40px}.empty h1{margin-bottom:16px}.empty p{font-size:24px;color:#526158;margin:0 0 28px}.desktop-link{display:none}.admin{max-width:1060px;font-size:17px}.admin h1{margin-bottom:16px}.admin h2{font-size:22px;margin-top:0}.admin input,.admin textarea,.admin select{font-size:18px;min-height:48px}.admin label{font-size:18px;margin-top:14px}.admin .primary{font-size:20px;min-height:56px;padding:14px}.admin .message{font-size:18px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:26px 0}.stat{background:#e7ede6;padding:20px 14px;border-radius:16px;color:#526158}.stat strong{display:block;font-size:32px;color:#182820;margin-top:8px}.grid{display:grid;gap:20px}.panel{background:white;border:1px solid #dce3da;border-radius:18px;padding:22px;margin:20px 0}.grid .panel{margin:0}.row{padding:20px 0;border-top:1px solid #e0e5de;overflow-wrap:anywhere}.row p{margin:8px 0}.row strong{font-variant-numeric:tabular-nums;font-size:22px}.row button{margin:12px 10px 0 0}.row details{margin-top:16px}.row summary{cursor:pointer;color:#245c48}.preview{font-size:16px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:14px}.actions{display:flex;gap:16px;flex-wrap:wrap}dialog{max-width:500px;width:calc(100% - 32px);border:1px solid #a1b2a7;border-radius:18px;padding:24px;color:#182820;background:#f7f8f5}dialog::backdrop{background:#18282066}dialog p{overflow-wrap:anywhere}dialog button{margin-top:16px}dialog input{margin-bottom:16px;font-size:20px}[hidden]{display:none!important}@media(min-width:768px){main:not(.admin){max-width:540px}.desktop-link{display:block;text-align:right;padding-bottom:20px;font-size:16px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:350px){main{padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}.stats{gap:6px}.stat{padding:16px 8px}}@media(max-height:600px){.login{padding-top:12px}.coupon-details{padding:20px 0;gap:20px}}

.pin-login{padding-top:clamp(12px,5vh,48px);align-items:center;text-align:center}.pin-login h1{margin-bottom:18px}.pin-login .hint{margin:0 0 16px}.pin-dots{display:flex;justify-content:center;gap:18px;margin:16px 0 12px;min-height:24px}.pin-dot{width:18px;height:18px;border:2px solid #526158;border-radius:50%;background:transparent}.pin-dot.filled{background:#245c48;border-color:#245c48}.pin-pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 24px;width:100%;max-width:340px;margin:auto 0 0;padding-top:24px}.pin-key{min-height:68px;aspect-ratio:1.2;border:0;border-radius:50%;background:#e7ede6;color:#182820;font-size:34px;font-weight:600;touch-action:manipulation}.pin-key:active{background:#c4d8cb}.pin-key.delete{font-size:20px;background:transparent}.pin-login .message{min-height:30px}.pin-login .message:empty{margin-top:0}@media(max-height:650px){.pin-login{padding-top:0}.pin-pad{gap:10px 24px;padding-top:14px;max-width:300px}.pin-key{min-height:56px;aspect-ratio:1.5}.pin-login h1{font-size:30px;margin-bottom:8px}.pin-dots{margin:12px 0}}
.coupon-amount{font-size:clamp(36px,10vw,48px);font-weight:800;line-height:1.25;color:#245c48;text-align:center;margin:16px 0 0;padding:14px 12px;background:#e7ede6;border-radius:16px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

<body>
<main id="app"></main>
<dialog id="dialog"></dialog>
<script>
'use strict';
const root=document.querySelector('#app'),dialog=document.querySelector('#dialog');
const adminMode=new URLSearchParams(location.search).get('view')==='admin';
const pendingKey='family-coupons.pending';
let epoch=0,token='',csrf='',cancelHold=()=>{},busy=false;
const escapeHtml=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID();
function pending(){try{return sessionStorage.getItem(pendingKey)||'';}catch{return '';}}
function message(value){const el=document.querySelector('#message');if(el)el.textContent=value instanceof Error?value.message:value;}
async function api(path,body,headers={}){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
 try{const response=await fetch(path,{method:body===undefined?'GET':'POST',cache:'no-store',credentials:'same-origin',signal:controller.signal,headers:{...(body===undefined?{}:{'Content-Type':'application/json'}),...headers},body:body===undefined?undefined:JSON.stringify(body)});const result=await response.json();if(!response.ok){const error=new Error(result.error||'操作失败，请稍后重试。');error.status=response.status;throw error;}return result;}
 catch(error){if(error.status)throw error;throw new Error('网络连接中断，请检查网络后重试。');}finally{clearTimeout(timer);}
}
function shell(html){document.onkeydown=null;cancelHold();dialog.close();dialog.innerHTML='';epoch++;busy=false;root.className=adminMode?'admin':'';root.innerHTML=(!adminMode?'<a class="desktop-link" href="/?view=admin">管理</a>':'')+html;}
function login(note=''){
 token='';csrf='';if(!adminMode){pinLogin(note);return;}const op=false;
 shell(`<section class="screen login"><h1>${adminMode?'管理券池':op?'确认使用结果':'请输入密码'}</h1>${op?'<p class="hint">请勿重复验券。输入密码核实上一张的使用结果。</p>':''}<form id="login" autocomplete="off"><label for="password">${adminMode?'管理员密码':'进入密码'}</label><input id="password" type="password" ${adminMode?'':'inputmode="numeric" pattern="[0-9]+"'} autocomplete="off" required maxlength="128"><button class="primary">${adminMode?'解锁管理':op?'重新检查':'查看券码'}</button></form><p id="message" class="message" role="status" aria-live="polite"></p>${adminMode?'<p><a href="/">返回券夹</a></p>':''}</section>`);message(note);
 root.querySelector('form').addEventListener('submit',async event=>{event.preventDefault();if(busy)return;busy=true;const generation=epoch,input=root.querySelector('input'),password=input.value;input.value='';const button=root.querySelector('button');button.disabled=true;message('正在检查…');try{
  if(adminMode){const result=await api('/api/admin/login',{password});if(generation!==epoch||document.hidden)return;csrf=result.csrf;await loadAdmin(generation);}
  else {const result=await api('/api/unlock',{password,...(op?{operationId:op}:{})});if(generation!==epoch||document.hidden)return;if(op){if(result.saved){sessionStorage.removeItem(pendingKey);result.remaining?login('上一张已记录使用，请输入密码查看下一张。'):empty();}else{sessionStorage.removeItem(pendingKey);login('尚未记录使用。请重新输入密码查看原券并核实。');}}else if(result.empty)empty();else{token=result.token;showCoupon(result);}}
 }catch(error){if(generation===epoch)message(error);}finally{if(generation===epoch){busy=false;button.disabled=false;}}});
}
function pinLogin(note=''){
 const op=pending();let digits='';
 shell(`<section class="screen pin-login"><h1>${op?'确认使用结果':'请输入密码'}</h1><p class="hint">${op?'请勿重复验券，输入六位密码核实':'请输入六位数字密码'}</p><div class="pin-dots" role="img" aria-label="已输入0位，共6位">${'<span class="pin-dot"></span>'.repeat(6)}</div><p id="message" class="message" role="status" aria-live="polite"></p><div class="pin-pad" aria-label="数字键盘">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" class="pin-key" data-digit="${n}" aria-label="${n}">${n}</button>`).join('')}<span></span><button type="button" class="pin-key" data-digit="0" aria-label="0">0</button><button type="button" class="pin-key delete" aria-label="删除一位">删除</button></div></section>`);
 message(note);const generation=epoch;
 function draw(){root.querySelectorAll('.pin-dot').forEach((dot,i)=>dot.classList.toggle('filled',i<digits.length));root.querySelector('.pin-dots').setAttribute('aria-label',`已输入${digits.length}位，共6位`);}
 function press(value){if(busy||generation!==epoch)return;if(value==='delete')digits=digits.slice(0,-1);else if(digits.length<6)digits+=value;draw();if(digits.length===6)void submit();}
 root.querySelectorAll('[data-digit]').forEach(b=>b.onclick=()=>press(b.dataset.digit));root.querySelector('.delete').onclick=()=>press('delete');
 document.onkeydown=e=>{if(generation!==epoch||e.ctrlKey||e.metaKey||e.altKey)return;if(/^[0-9]$/.test(e.key)){e.preventDefault();press(e.key);}else if(e.key==='Backspace'){e.preventDefault();press('delete');}};
 async function submit(){busy=true;const password=digits;root.querySelectorAll('button').forEach(b=>b.disabled=true);message('正在检查…');try{const result=await api('/api/unlock',{password,...(op?{operationId:op}:{})});if(generation!==epoch||document.hidden)return;if(op){sessionStorage.removeItem(pendingKey);if(result.saved){result.remaining?login('上一张已记录使用，请输入密码查看下一张。'):empty();}else login('尚未记录使用。请重新输入密码查看原券并核实。');}else if(result.empty)empty();else{token=result.token;showCoupon(result);}}catch(error){if(generation===epoch){digits='';draw();message(error);}}finally{digits='';if(generation===epoch){busy=false;root.querySelectorAll('button').forEach(b=>b.disabled=false);}}}
}
function empty(){token='';shell('<section class="screen empty"><h1>券已用完</h1><p>请联系家人添加</p><button class="primary" id="check">重新检查</button><p id="message" class="message" role="status"></p></section>');root.querySelector('#check').onclick=async()=>{const generation=epoch,b=root.querySelector('button');b.disabled=true;try{const result=await api('/api/status');if(generation===epoch&&!result.empty)login();else if(generation===epoch)message('暂时没有新增券，请联系家人添加。');}catch(e){if(generation===epoch)message(e);}finally{if(b.isConnected)b.disabled=false;}};}
function showCoupon(result){const c=result.coupon; shell(`<section class="screen"><p class="remaining">剩余 ${result.remaining} 张（含本张）</p>${c.amount!=null&&c.amount!==''?`<p class="coupon-amount">金额：¥${escapeHtml(c.amount)}</p>`:''}<div class="coupon-details"><div><div class="caption">卡号</div><div class="secret">${escapeHtml(c.number.replace(/(.{4})(?=.)/g,'$1 '))}</div></div><div><div class="caption">密码</div><div class="secret">${escapeHtml(c.password)}</div></div></div><button id="hold" class="primary hold">按住3秒，标记已使用</button><p id="message" class="message" role="status"></p></section>`);
 const button=root.querySelector('#hold');let started=null,frame=0,pointer=null;
 cancelHold=()=>{cancelAnimationFrame(frame);started=null;pointer=null;button.style.setProperty('--progress',0);if(!button.disabled)button.textContent='按住3秒，标记已使用';};
 const tick=()=>{if(started===null)return;const elapsed=performance.now()-started;button.style.setProperty('--progress',Math.min(elapsed/3000,1));button.textContent=`继续按住 ${Math.max(1,Math.ceil((3000-elapsed)/1000))} 秒`;if(elapsed>=3000){cancelHold();void saveUse();}else frame=requestAnimationFrame(tick);};
 button.onpointerdown=e=>{if(busy||pointer!==null||!e.isPrimary||e.button!==0)return;e.preventDefault();pointer=e.pointerId;button.setPointerCapture(pointer);started=performance.now();tick();};
 button.onpointermove=e=>{if(e.pointerId!==pointer)return;const r=button.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)cancelHold();};
 for(const name of ['pointerup','pointercancel','lostpointercapture','pointerleave'])button.addEventListener(name,cancelHold);
 button.oncontextmenu=e=>e.preventDefault();
 async function saveUse(){if(busy)return;busy=true;button.disabled=true;button.textContent='正在记录…';const generation=epoch,auth=token,operationId=uid();let sent=false;try{sessionStorage.setItem(pendingKey,operationId);sent=true;const outcome=await api('/api/use',{operationId},{Authorization:`Bearer ${auth}`});sessionStorage.removeItem(pendingKey);if(generation===epoch&&!document.hidden)outcome.remaining?login('上一张已记录使用，请输入密码查看下一张。'):empty();}
 catch(error){if(error.status){sessionStorage.removeItem(pendingKey);if(generation===epoch){if(error.status===401||error.status===409)login(error.message);else{message(error);button.disabled=false;button.textContent='按住3秒，标记已使用';busy=false;}}}else if(generation===epoch){if(sent)login('正在确认使用结果，请勿重复验券');else{message('无法保存本机核实标记，请检查浏览器存储设置。');button.disabled=false;button.textContent='按住3秒，标记已使用';busy=false;}}}
 }
}
function localTime(value){return new Date(value).toLocaleString();}
async function loadAdmin(generation=epoch){const data=await api('/api/admin/data');if(generation===epoch&&!document.hidden)showAdmin(data);}
function showAdmin(data){const unused=data.coupons.filter(c=>c.status==='unused'),used=data.coupons.filter(c=>c.status==='used').sort((a,b)=>b.usedAt.localeCompare(a.usedAt));
 const row=c=>`<article class="row"><strong>${escapeHtml(c.number)}</strong><p>密码：${escapeHtml(c.password)}</p>${c.amount!=null&&c.amount!==''?`<p>金额：¥${escapeHtml(c.amount)}</p>`:''}<p class="hint">添加：${escapeHtml(localTime(c.createdAt))}${c.usedAt?'<br>使用：'+escapeHtml(localTime(c.usedAt)):''}</p><button class="secondary" data-${c.status==='unused'?'edit':'restore'}="${escapeHtml(c.id)}">${c.status==='unused'?'修改券码':'恢复误标'}</button><details><summary>历史详情</summary>${data.events.filter(e=>e.couponId===c.id).map(e=>`<p>${escapeHtml(({used:'标记使用',restored:'恢复未使用',edited:'修改券码'})[e.type]||e.type)} · ${escapeHtml(localTime(e.at))}</p>`).join('')||'<p>暂无使用或修改记录</p>'}</details></article>`;
 shell(`<div class="topbar"><h1>管理券池</h1><div class="actions"><a href="/">返回券夹</a><button class="secondary" id="logout">退出管理</button></div></div><p class="hint">管理操作请避开老人现场验券时间。</p><p id="message" class="message" role="status"></p><div class="stats"><div class="stat">全部<strong>${data.coupons.length}</strong></div><div class="stat">未使用<strong>${unused.length}</strong></div><div class="stat">已使用<strong>${used.length}</strong></div></div><div class="grid"><section class="panel"><h2>添加一张券</h2><form id="single" autocomplete="off"><label for="number">卡号</label><input id="number" required maxlength="500"><label for="secret">券密码</label><input id="secret" required maxlength="500"><label for="amount">金额（整数元，可选）</label><input id="amount" inputmode="numeric" maxlength="9" pattern="[0-9]{1,9}" placeholder="不填则不显示"><button class="primary">保存券码</button></form></section><section class="panel"><h2>批量添加</h2><p class="hint">每行填写“卡号 密码 [金额]”，金额须为整数，可省略；空格或制表符分隔。</p><textarea id="batch" rows="4" aria-label="批量券码" placeholder="001234567890 001234"></textarea><button class="secondary" id="preview">预览并检查</button><div id="preview-result" class="preview"></div><button class="primary" id="import" hidden>确认整体导入</button></section></div><section class="panel"><h2>未使用 · 按添加顺序</h2>${unused.map(row).join('')||'<p class="hint">还没有未使用券</p>'}</section><section class="panel"><h2>已使用 · 最近优先</h2>${used.map(row).join('')||'<p class="hint">还没有使用记录</p>'}</section><section class="panel"><h2>密码设置</h2><p class="hint">老人密码固定6位数字；新管理员密码至少8位。首次登录请修改默认密码。</p><form id="settings"><label for="role">修改哪一个密码</label><select id="role"><option value="access">老人进入密码</option><option value="admin">管理员密码</option></select><label for="new-password">新密码</label><input id="new-password" type="password" required maxlength="128" autocomplete="new-password"><button class="primary">保存新密码</button></form></section>`);
 root.querySelector('#logout').onclick=async()=>{try{await api('/api/admin/logout',{}, {'X-CSRF-Token':csrf});}finally{login();}};
 root.querySelector('#single').onsubmit=e=>{e.preventDefault();void change({type:'added',rows:[{number:root.querySelector('#number').value.trim(),password:root.querySelector('#secret').value.trim(),amount:root.querySelector('#amount').value.trim()}]});};
 const textarea=root.querySelector('#batch'),importButton=root.querySelector('#import');let rows=[];textarea.oninput=()=>{rows=[];importButton.hidden=true;};
 root.querySelector('#preview').onclick=()=>{const seen=new Set(data.coupons.map(c=>c.number));rows=textarea.value.split(/\r?\n/).map((line,index)=>({line:line.trim(),row:index+1})).filter(r=>r.line).map(r=>{const parts=r.line.split(/\s+/),number=parts[0],password=parts[1]||'',amount=parts[2]||'';const error=![2,3].includes(parts.length)?'格式错误':amount&&!/^[0-9]{1,9}$/.test(amount)?'金额格式错误':number.length>500||password.length>500?'内容过长':seen.has(number)?'重复卡号':'';seen.add(number);return {...r,number,password,amount,error};});root.querySelector('#preview-result').textContent=rows.map(r=>`第 ${r.row} 行 · ${r.error||'有效'} · ${r.number}${r.amount?` · ¥${r.amount}`:''}`).join('\n')||'请输入券码。';importButton.hidden=!rows.length||rows.length>1000||rows.some(r=>r.error);};
 importButton.onclick=()=>void change({type:'added',rows:rows.map(({number,password,amount})=>({number,password,amount}))});
 root.querySelector('#settings').onsubmit=e=>{e.preventDefault();void change({type:'password_changed',role:root.querySelector('#role').value,password:root.querySelector('#new-password').value});};
 root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const c=data.coupons.find(c=>c.id===b.dataset.edit);dialog.innerHTML=`<h2>修改券码</h2><form><label for="edit-number">卡号</label><input id="edit-number" value="${escapeHtml(c.number)}" required maxlength="500"><label for="edit-password">券密码</label><input id="edit-password" value="${escapeHtml(c.password)}" required maxlength="500"><label for="edit-amount">金额（整数元，可选，清空可移除）</label><input id="edit-amount" value="${escapeHtml(c.amount??'')}" inputmode="numeric" maxlength="9" pattern="[0-9]{1,9}"><button class="primary">保存修改</button><button type="button" class="secondary" id="cancel">取消</button></form>`;dialog.showModal();dialog.querySelector('#cancel').onclick=()=>dialog.close();dialog.querySelector('form').onsubmit=e=>{e.preventDefault();const payload={type:'edited',couponId:c.id,number:dialog.querySelector('#edit-number').value.trim(),password:dialog.querySelector('#edit-password').value.trim(),amount:dialog.querySelector('#edit-amount').value.trim()};dialog.close();void change(payload);};});
 root.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{const c=data.coupons.find(c=>c.id===b.dataset.restore);dialog.innerHTML=`<h2>恢复误标</h2><p>确认将 ${escapeHtml(c.number)} 恢复为未使用？原使用记录会保留。</p><button id="confirm" class="primary">确认恢复</button><button id="cancel" class="secondary">取消</button>`;dialog.showModal();dialog.querySelector('#cancel').onclick=()=>dialog.close();dialog.querySelector('#confirm').onclick=()=>{dialog.close();void change({type:'restored',couponId:c.id});};});
}
async function change(payload){if(busy)return;busy=true;const generation=epoch;root.querySelectorAll('button').forEach(b=>b.disabled=true);message('正在保存…');const operationId=uid();try{await api('/api/admin/change',{...payload,operationId},{'X-CSRF-Token':csrf});if(generation!==epoch||document.hidden)return;if(payload.type==='password_changed'&&payload.role==='admin'){login('管理员密码已更新，请重新登录。');return;}await loadAdmin(generation);message('已保存。');}
 catch(error){if(generation!==epoch)return;if(error.status===401){login(error.message);}else if(!error.status){shell('<h1>请核实保存结果</h1><p>网络中断，请勿重复提交。重新登录管理，检查券码列表和历史记录。</p><button class="primary" id="relogin">重新登录</button>');root.querySelector('#relogin').onclick=()=>login();}else message(error);}
 finally{if(generation===epoch){busy=false;root.querySelectorAll('button').forEach(b=>b.disabled=false);}}
}
function relock(){cancelHold();login();}
document.addEventListener('visibilitychange',relock);
window.addEventListener('pagehide',relock);
window.addEventListener('pageshow',e=>{if(e.persisted)relock();});
login();
</script>
