services:
  coupons:
    image: family-coupons:1.0
    container_name: family-coupons
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      COOKIE_SECURE: "true"
      TZ: Asia/Shanghai
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
